name: flutter_ptt_app
description: Push-to-Talk Voice Transmission App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP requests
  http: ^1.1.0
  
  # Real-time communication
  signalr_netcore: ^1.3.7
  
  # Audio recording and playback
  record: ^5.0.4
  audioplayers: ^5.2.1
  
  # Permissions
  permission_handler: ^11.0.1
  
  # State management
  provider: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.2
  
  # Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
