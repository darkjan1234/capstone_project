<div bsModal #createOrEditModal="bs-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="createOrEditModal" aria-hidden="true" [config]="{backdrop: 'static'}">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form *ngIf="active" #communicationHistoryForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                <div class="modal-header">
                    <h4 class="modal-title">
                        <span *ngIf="communicationHistory.id">{{l("EditCommunicationHistory")}}</span>
                        <span *ngIf="!communicationHistory.id">{{l("CreateNewCommunicationHistory")}}</span>
                    </h4>                    
                    
                    
                 <button type="button" class="btn-close" (click)="close()" aria-label="Close" [disabled]="saving"></button>
             
                </div>
                <div class="modal-body">
                 




								<div class="my5">
									<label class="form-label" for="CommunicationHistory_UserId">{{l("UserId")}}</label>
									<input type="number" #CommunicationHistory_UserId="ngModel" id="CommunicationHistory_UserId" class="form-control" [(ngModel)]="communicationHistory.userId" name="UserId"    />
									<validation-messages [formCtrl]="CommunicationHistory_UserId"></validation-messages>
								</div>
					
								<div class="my-3">
									<label class="form-label" for="CommunicationHistory_Action">{{l("Action")}} *</label>
									<input type="text" #CommunicationHistory_Action="ngModel" id="CommunicationHistory_Action" class="form-control" [(ngModel)]="communicationHistory.action" name="Action"     required/>
								    <validation-messages [formCtrl]="CommunicationHistory_Action"></validation-messages>
								</div>
					
								<div class="my5">
									<label class="form-label" for="CommunicationHistory_ReferenceId">{{l("ReferenceId")}}</label>
									<input type="number" #CommunicationHistory_ReferenceId="ngModel" id="CommunicationHistory_ReferenceId" class="form-control" [(ngModel)]="communicationHistory.referenceId" name="ReferenceId"    />
									<validation-messages [formCtrl]="CommunicationHistory_ReferenceId"></validation-messages>
								</div>
					

                </div>
                <div class="modal-footer">
                    <button [disabled]="saving" type="button" class="btn btn-default" (click)="close()">{{l("Cancel")}}</button>
                    <button type="submit" class="btn btn-primary blue" [disabled]="!communicationHistoryForm.form.valid" [buttonBusy]="saving" [busyText]="l('SavingWithThreeDot')"><i class="fa fa-save"></i> <span>{{l("Save")}}</span></button>
                </div>
            </form>
        </div>
    </div>

</div>
