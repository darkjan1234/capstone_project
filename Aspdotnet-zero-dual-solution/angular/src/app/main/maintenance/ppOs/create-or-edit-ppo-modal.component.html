<div
    bsModal
    #createOrEditModal="bs-modal"
    class="modal fade"
    tabindex="-1"
    role="dialog"
    aria-labelledby="createOrEditModal"
    aria-hidden="true"
    [config]="{ backdrop: 'static' }"
>
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form *ngIf="active" #ppoForm="ngForm" novalidate (ngSubmit)="save()" autocomplete="off">
                <div class="modal-header">
                    <h4 class="modal-title">
                        <span *ngIf="ppo.id">{{ l('EditPPO') }}</span>
                        <span *ngIf="!ppo.id">{{ l('CreateNewOffice') }}</span>
                    </h4>

                    <button
                        type="button"
                        class="btn-close"
                        (click)="close()"
                        aria-label="Close"
                        [disabled]="saving"
                    ></button>
                </div>
                <div class="modal-body">
                    <div class="my-3">
                        <label class="form-label" for="PPO_ProvincialName">{{ l('ProvincialName') }} *</label>
                        <input
                            type="text"
                            #PPO_ProvincialName="ngModel"
                            id="PPO_ProvincialName"
                            class="form-control"
                            [(ngModel)]="ppo.provincialName"
                            name="ProvincialName"
                            required
                        />
                        <validation-messages [formCtrl]="PPO_ProvincialName"></validation-messages>
                    </div>

                    <br />
                    <label class="form-check form-check-custom form-check-solid">
                        <input
                            id="PPO_isActive"
                            #PPO_isActive="ngModel"
                            name="isActive"
                            [(ngModel)]="ppo.isActive"
                            type="checkbox"
                            class="form-check-input"
                        />
                        <span class="form-check-label">
                            {{ l('isActive') }}
                        </span>
                    </label>
                    <validation-messages [formCtrl]="PPO_isActive"></validation-messages>
                </div>
                <div class="modal-footer">
                    <button [disabled]="saving" type="button" class="btn btn-default" (click)="close()">
                        {{ l('Cancel') }}
                    </button>
                    <button
                        type="submit"
                        class="btn btn-primary blue"
                        [disabled]="!ppoForm.form.valid"
                        [buttonBusy]="saving"
                        [busyText]="l('SavingWithThreeDot')"
                    >
                        <i class="fa fa-save"></i>
                        <span>{{ l('Save') }}</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
